name: Publish to GitHub Packages

# This workflow publishes @tombabu472-star/nova-commandkit to the GitHub Packages
# npm registry. It runs automatically when you create a GitHub Release, or
# can be triggered manually from the Actions tab.
#
# GitHub Packages for npm requires:
#  - the package name to be scoped to your username/org (@tombabu472-star/...)
#  - "publishConfig": { "registry": "https://npm.pkg.github.com" } in package.json
#  - authentication via the built-in GITHUB_TOKEN (provided automatically to Actions)

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to publish to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tombabu472-star'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
