name: Publish

# This workflow publishes @tombabu472-star/nova-commandkit to:
#   1. The PUBLIC npm registry (npmjs.com) — anyone can install, no auth needed
#   2. GitHub Packages (bonus, same code under the same scoped name)
#
# It runs automatically when you create a GitHub Release, or can be triggered
# manually from the Actions tab.
#
# The npmjs.com publish requires an `NPM_TOKEN` secret (an npm automation token).
# The GitHub Packages publish uses the built-in `GITHUB_TOKEN` (no secret needed).

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            bin
            package.json
            README.md
            LICENSE

  publish-npm:
    name: Publish to npmjs.com (public)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Publish to npmjs.com (skipped if NPM_TOKEN not set)
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npmjs.com publish."
            echo "::notice::Add an npm automation token as the NPM_TOKEN repo secret to enable public npm publishing."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages (bonus)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tombabu472-star'
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
